<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=servicios/">
    <link rel="canonical" href="https://www.ismdeveloper.cl/servicios/">
    <title>Servicios | ISM Developer</title>
    <script>
        (() => {
            const currentUrl = new URL(window.location.href);
            const serviceId = currentUrl.searchParams.get("servicio");
            const targetUrl = new URL("servicios/", currentUrl);
            if (serviceId) targetUrl.hash = serviceId;
            window.location.replace(targetUrl);
        })();
    </script>
</head>
<body>
    <main>
        <h1>Servicios de ISM Developer</h1>
        <p>Esta dirección cambió. <a href="servicios/">Ir al catálogo de servicios</a>.</p>
    </main>
</body>
</html>
